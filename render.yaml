services:
  - type: web
    name: sigmaforge-dashboard
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sigmaforge serve --host 0.0.0.0 --port $PORT --rules rules --cases tests/cases.json
    healthCheckPath: /api/health
    autoDeployTrigger: commit
